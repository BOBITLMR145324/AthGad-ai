<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AthGad AI - Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}" />
  </head>
  <body
    class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen px-4"
  >
    <div
      class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl"
    >
      <!-- Logo Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2.5 mb-2">
          <!-- Logo Icon Container -->
          <div class="w-8 h-8 flex-shrink-0 flex items-center justify-center">
            {% include '_logo.html' %}
          </div>

          <!-- Title -->
          <span class="text-white font-black tracking-wider text-xl uppercase"
            >AthGad AI</span
          >
        </div>
        <p class="text-slate-400 text-sm">
          Sign in to view your alerts and risk dashboard
        </p>
      </div>

      <!-- Flash Messages Container -->
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %}
      <div id="flash-alerts-wrapper" class="space-y-2 mb-4">
        {% for category, message in messages %}
        <div
          class="flash-alert p-3 rounded-lg text-xs font-medium transition-opacity duration-500 opacity-100 {% if category == 'error' %}bg-red-950/40 border border-red-800 text-red-200{% else %}bg-emerald-950/40 border border-emerald-800 text-emerald-200{% endif %}"
        >
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %} {% endwith %}

      <!-- Login Form -->
      <form action="/login" method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div>
          <label
            class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2"
            >Email Address</label
          >
          <input
            type="email"
            name="email"
            required
            autocomplete="email"
            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition"
          />
        </div>

        <div>
          <label
            class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2"
            >Password</label
          >
          <div class="relative password-wrapper">
            <input
              type="password"
              name="password"
              required
              autocomplete="current-password"
              class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 pr-10 text-sm text-white focus:outline-none focus:border-emerald-500 transition"
            />
            <button
              type="button"
              class="js-toggle-password password-toggle"
              aria-label="Show password"
            >
              <svg
                class="eye-open"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
              <svg
                class="eye-closed hidden"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                />
              </svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold uppercase tracking-wider text-sm py-3 rounded-lg transition duration-200 cursor-pointer"
        >
          Sign In
        </button>
      </form>

      <!-- Toggle to Register Link -->
      <div class="mt-6 text-center text-sm border-t border-slate-800/60 pt-5">
        <span class="text-slate-400">Don't have an account?</span>
        <a
          href="/register"
          class="text-emerald-400 hover:text-emerald-300 font-semibold ml-1 transition"
          >Register here</a
        >
      </div>
    </div>

    <!-- 2-Second Auto-Dismiss Script for Flash Alerts -->
    <script src="/static/js/flash-alerts.js?v={{ asset_version }}"></script>

    <script src="/static/js/password-toggle.js?v={{ asset_version }}"></script>
  </body>
</html>
